services:
  - type: web
    name: banni-reel-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN_1
        sync: false
      - key: META_ACCESS_TOKEN_2
        sync: false
